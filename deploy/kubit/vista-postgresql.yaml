apiVersion: v1
kind: Service
metadata:
  name: vista-postgresql
  namespace: konkooria
  labels:
    app.kubernetes.io/name: vista-postgresql
    app.kubernetes.io/part-of: vista
spec:
  clusterIP: None
  selector:
    app.kubernetes.io/name: vista-postgresql
  ports:
    - name: postgres
      port: 5432
      targetPort: postgres
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: vista-postgresql
  namespace: konkooria
  labels:
    app.kubernetes.io/name: vista-postgresql
    app.kubernetes.io/part-of: vista
spec:
  serviceName: vista-postgresql
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: vista-postgresql
  template:
    metadata:
      labels:
        app.kubernetes.io/name: vista-postgresql
        app.kubernetes.io/part-of: vista
    spec:
      containers:
        - name: postgres
          image: postgres:17
          imagePullPolicy: IfNotPresent
          ports:
            - name: postgres
              containerPort: 5432
          env:
            - name: PGDATA
              value: /var/lib/postgresql/data/pgdata
            - name: POSTGRES_DB
              valueFrom:
                secretKeyRef:
                  name: vista-postgresql
                  key: POSTGRES_DB
            - name: POSTGRES_USER
              valueFrom:
                secretKeyRef:
                  name: vista-postgresql
                  key: POSTGRES_USER
            - name: POSTGRES_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: vista-postgresql
                  key: POSTGRES_PASSWORD
          readinessProbe:
            exec:
              command: ["sh", "-c", "pg_isready -U \"$POSTGRES_USER\" -d \"$POSTGRES_DB\" -h 127.0.0.1"]
            initialDelaySeconds: 10
            periodSeconds: 5
            timeoutSeconds: 3
            failureThreshold: 12
          livenessProbe:
            exec:
              command: ["sh", "-c", "pg_isready -U \"$POSTGRES_USER\" -d \"$POSTGRES_DB\" -h 127.0.0.1"]
            initialDelaySeconds: 30
            periodSeconds: 10
            timeoutSeconds: 3
            failureThreshold: 6
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
            limits:
              cpu: 500m
              memory: 512Mi
          volumeMounts:
            - name: data
              mountPath: /var/lib/postgresql/data
  volumeClaimTemplates:
    - metadata:
        name: data
        labels:
          app.kubernetes.io/name: vista-postgresql
          app.kubernetes.io/part-of: vista
      spec:
        accessModes: ["ReadWriteOnce"]
        storageClassName: ssd-delete
        resources:
          requests:
            storage: 5Gi
